<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Página</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;   /* centra horizontal */
      align-items: center;       /* centra vertical */
      background: linear-gradient(135deg, #1e293b, #0f172a);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
    }

    .card {
      max-width: 500px;
      padding: 2rem;
      background-color: rgba(15, 23, 42, 0.9);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 1rem;
      color: #38bdf8;
      font-size: 2rem;
    }

    p {
      line-height: 1.6;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Eduardo Valverde</h1>
    <p>
      Espero aprender los fundamentos del desarrollo Front-End, incluyendo HTML5, CSS3 y JavaScript,
      para mejorar mis habilidades en el front y crear interfaces web modernas e interactivas.
    </p>
  </main>
</body>
</html>
